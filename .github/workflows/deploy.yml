# GitHub Pages 자동 배포 워크플로우
# 현재 개발 브랜치에 push할 때마다 자동으로 빌드하고 배포합니다.

name: Deploy to GitHub Pages

on:
  # 현재 브랜치에 push할 때 실행
  push:
    branches:
      - claude/analyze-site-link-011CUWhXkUDFxcQTW1rVr15u

  # 수동으로도 실행 가능
  workflow_dispatch:

# GitHub Pages에 배포하기 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 실행되도록 설정
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 빌드 작업
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. 프로덕션 빌드
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # 5. GitHub Pages 설정
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. 빌드 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 배포 작업
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
